name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-and-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: app/global.json
      - name: Build and test (API, Contracts, App.Core)
        run: |
          dotnet test --project tests/Expovice.Api.Tests
          dotnet test --project tests/Expovice.App.Core.Tests
      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  maui-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: app/global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - run: dotnet workload install maui-android
      - name: Build Android app
        run: dotnet build src/Expovice.App -f net10.0-android -c Release
